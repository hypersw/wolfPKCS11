name: build-dll
on:
  workflow_dispatch:
  push:
    tags: [ 'dll-*' ]

permissions:           # for the provenance attestation
  id-token: write
  attestations: write
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout wolfPKCS11 (this fork)
        uses: actions/checkout@v4
        with: { path: wolfpkcs11 }
      - name: Checkout wolfTPM
        uses: actions/checkout@v4
        with: { repository: wolfssl/wolftpm, path: wolftpm }   # pin a release tag
      - name: Checkout wolfSSL
        uses: actions/checkout@v4
        with: { repository: wolfssl/wolfssl, path: wolfssl }   # pin a release tag

      - name: Create FIPS stub files (autogen expectation)   # copied from stock win-test.yml
        working-directory: wolfssl
        run: |
          echo $null >> wolfcrypt\src\fips.c
          echo $null >> wolfcrypt\src\fips_test.c
          echo $null >> wolfcrypt\src\wolfcrypt_first.c
          echo $null >> wolfcrypt\src\wolfcrypt_last.c

      - name: Set up MSVC env (cl + dumpbin)
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build provider DLL (force PKCS#11 export macros)
        env:
          CL: /DWP11_DLL /DBUILDING_WOLFPKCS11    # makes WP11_API = dllexport
          LINK: tbs.lib ws2_32.lib                # wolfTPM needs TPM Base Services; wolfSSL needs ws2_32
          _CL_: /MT                               # static CRT; _CL_ is appended so /MT wins over the projects' /MD
        # Build the static 'Release' config: wolfSSL/wolfTPM are StaticLibrary here and get folded into
        # wolfpkcs11.dll (which we flipped to DynamicLibrary) -> a single self-contained provider DLL.
        run: msbuild /m /t:wolfpkcs11 /p:PlatformToolset=v143 /p:Platform=x64 /p:Configuration=Release wolfpkcs11\IDE\VisualStudio\wolfpkcs11.sln

      - name: Acceptance gate — single DLL, C_GetFunctionList exported, no wolf companions
        shell: pwsh
        run: |
          $dir = "wolfpkcs11\IDE\VisualStudio\Release\x64"
          $dll = "$dir\wolfpkcs11.dll"
          if (-not (Test-Path $dll)) { throw "wolfpkcs11.dll not produced at $dir" }
          $hit = dumpbin /exports "$dll" | Select-String 'C_GetFunctionList'
          if (-not $hit) { throw "C_GetFunctionList NOT exported" }
          $deps = dumpbin /dependents "$dll"
          Write-Host "Dependents:"; ($deps | Select-String '\.dll') | ForEach-Object { Write-Host ("   " + $_.Line.Trim()) }
          if ($deps | Select-String -Pattern 'wolfssl\.dll|wolftpm\.dll') { throw "still depends on wolfssl/wolftpm DLL — not self-contained" }
          if ($deps | Select-String -Pattern 'vcruntime|ucrtbase|msvcp|api-ms-win-crt') { throw "dynamic CRT dependency present — /MT static CRT did not take" }
          Write-Host ("OK: single self-contained DLL, static CRT. Size: {0:N0} bytes" -f (Get-Item $dll).Length)

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: wolfpkcs11-x64
          path: wolfpkcs11\IDE\VisualStudio\Release\x64\wolfpkcs11.dll

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: wolfpkcs11\IDE\VisualStudio\Release\x64\wolfpkcs11.dll
